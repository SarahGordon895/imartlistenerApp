name: vll_sms
description: imartListener — business SMS + WhatsApp capture with manual reply (iMart Group Ltd).
publish_to: "none"
version: 1.4.3+20

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.2
  permission_handler: ^11.3.1
  fluttertoast: ^9.0.0
  readsms: ^0.2.0+4
  sqflite: ^2.3.3
  path: ^1.9.0
  flutter_local_notifications: ^17.2.3
  sqflite_common_ffi: ^2.3.3
  package_info_plus: ^8.0.2
  url_launcher: ^6.3.1
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  # Official iMart Group Ltd mark.
  image_path: assets/imart-app-icon.png
  adaptive_icon_background: "#0B2C5F"
  adaptive_icon_foreground: assets/imart-app-icon.png
  remove_alpha_ios: true
  android: true
  ios: true
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true

flutter:
  uses-material-design: true
  assets:
    - assets/imart-logo.png
    - assets/imart-logo-white.png
    - assets/imart-app-icon.png
    - assets/vll-logo.png
    - assets/vll-logo-white.png
    - assets/vll-app-icon.png